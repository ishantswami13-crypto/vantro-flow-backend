name: Release readiness

# Runs `npm run release:readiness` against the deployed system: production
# API and database, the website, the published Windows installer and its
# download endpoint, sign-in with a test account, and a real pilot company's
# Bridge, connector, Scan, Watch, Simulate and Missions. Read-only.
#
# Configure (Settings > Secrets and variables > Actions):
#   vars.RELEASE_SITE_URL                        website origin, e.g. https://<final domain>
#   vars.RELEASE_API_URL                         optional, defaults to production
#   secrets.RELEASE_TEST_EMAIL / _PASSWORD       a test account
#   secrets.RELEASE_PILOT_EMAIL / _PASSWORD      an account with a real pilot company's data
# The run fails (red) whenever the verdict is NOT READY. Smoke checks alone
# cannot certify launch readiness; real-PC and full acceptance proof is required.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * *"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Release readiness
        env:
          RELEASE_SITE_URL: ${{ vars.RELEASE_SITE_URL }}
          RELEASE_API_URL: ${{ vars.RELEASE_API_URL }}
          RELEASE_TEST_EMAIL: ${{ secrets.RELEASE_TEST_EMAIL }}
          RELEASE_TEST_PASSWORD: ${{ secrets.RELEASE_TEST_PASSWORD }}
          RELEASE_PILOT_EMAIL: ${{ secrets.RELEASE_PILOT_EMAIL }}
          RELEASE_PILOT_PASSWORD: ${{ secrets.RELEASE_PILOT_PASSWORD }}
        run: npm run release:readiness -- --out release-readiness.json | tee release-readiness.txt
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: release-readiness.*
