name: Security Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      # Blocking. This previously ran `npm audit --audit-level=high` under
      # continue-on-error, which printed findings and passed regardless — a
      # high-severity advisory in a shipped dependency looked the same as a
      # clean run. The gate fails on anything high or critical that is not
      # explicitly allowlisted with a reason in the script.
      - name: Dependency audit gate
        run: npm run security:audit-gate

      - name: Ensure env files are not tracked
        shell: bash
        run: |
          tracked="$(git ls-files '.env' '.env.*' '*.pem' '*.key' '*.p12' '*.pfx' '*.secret' 'secrets/*' 'service-account*.json' ':!:*.example')"
          if [ -n "$tracked" ]; then
            echo "Tracked secret-like files are not allowed:"
            echo "$tracked"
            exit 1
          fi
