---
name: Outbound engine — migration integrity + queue, rate-limit, idempotency, tenancy tests

# Runs against an empty throwaway Postgres in the runner. No production or
# staging credentials; no provider credentials; external sending is forced
# off and every send goes to the in-memory sink.
#
# Proves when green:
#   - migration 062 applies to a fresh database AND re-applies cleanly
#     (it is additive and re-runnable)
#   - the outbound unit suite (content validation, classifiers, backoff,
#     MIME, credentials, rate-limit maths) passes
#   - the outbound engine suite passes: duplicate send races, crash and
#     ambiguous-send recovery, local-time windows, suppression, opt-out,
#     domain throttle, 429 Retry-After, retry + dead letter, stops, circuit
#     breaker, warm-up, concurrency, follow-ups, tenancy, leader lock
#
# The HTTP suite needs the full app schema to boot the server and is
# skipped here; it runs with `npm run test:outbound` on a full local DB.

on:
  push:
    paths:
      - "lib/domain/outbound/**"
      - "lib/routes/outreach.js"
      - "migrations/062_outbound_engine.sql"
      - "tests/outbound.*"
      - "tests/helpers/outboundHarness.js"
      - "tests/fixtures/outbound-ci-base.sql"
      - "server.js"
      - ".github/workflows/outbound-engine.yml"
  pull_request:

permissions:
  contents: read

jobs:
  outbound:
    name: "Outbound: 062 twice + unit + engine"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbound_ci
        ports:
          - 5432:5432
        # lib/db/pgConfig.js always connects with SSL, so the CI database
        # serves TLS with the image's self-signed snakeoil certificate.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outbound_ci
      JWT_SECRET: ci-outbound-secret-0123456789abcdef
      NODE_ENV: test
      FEATURE_EXTERNAL_MESSAGE_SENDING_ENABLED: "false"
      OUTBOUND_ENGINE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Enable TLS on the CI database
        run: |
          cid=$(docker ps -q --filter "ancestor=postgres:16")
          docker exec "$cid" bash -c "apt-get -qq update >/dev/null && apt-get -qq install -y ssl-cert >/dev/null && cp /etc/ssl/certs/ssl-cert-snakeoil.pem /var/lib/postgresql/server.crt && cp /etc/ssl/private/ssl-cert-snakeoil.key /var/lib/postgresql/server.key && chown postgres /var/lib/postgresql/server.* && chmod 600 /var/lib/postgresql/server.key"
          psql -h localhost -U postgres -d outbound_ci -c "ALTER SYSTEM SET ssl = on" -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" -c "SELECT pg_reload_conf()"
          psql "postgresql://postgres:postgres@localhost:5432/outbound_ci?sslmode=require" -tc "SHOW ssl"

      - name: Migration integrity (062 applied twice)
        run: |
          psql -h localhost -U postgres -d outbound_ci -v ON_ERROR_STOP=1 -q -f tests/fixtures/outbound-ci-base.sql
          psql -h localhost -U postgres -d outbound_ci -v ON_ERROR_STOP=1 -q -f migrations/062_outbound_engine.sql
          PGOPTIONS='-c client_min_messages=warning' psql -h localhost -U postgres -d outbound_ci -v ON_ERROR_STOP=1 -q -f migrations/062_outbound_engine.sql
          n=$(psql -h localhost -U postgres -d outbound_ci -tAc "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'outbound_%'")
          echo "outbound tables: $n"
          test "$n" = "22"

      - name: Syntax check
        run: npm run check

      - name: Outbound tests (unit + engine; HTTP skipped without the full schema)
        run: npm run test:outbound

      - name: Read-only preflight renders
        run: npm run outreach:preflight || true
